<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海大電機・學程島</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sea1:#c9f0fa;--sea2:#7cc8e6;--sand:#fde7b0;--grass:#9fdc9a;--grass2:#6cc283;--ink:#23405a;--card:#ffffffe6;--line:#23405a30;--acc:#ff5d85;--halo:#ffffffd0;--lab:#1f3b2a;--bub:#fff;--dimop:.28}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea1:#143553;--sea2:#0a1c30;--sand:#9c8453;--grass:#2f7a52;--grass2:#245f42;--ink:#e6f1fa;--card:#14263bea;--line:#e6f1fa30;--halo:#0a1c30e0;--lab:#f2f8ee;--bub:#1d3550}}
:root[data-theme="dark"]{--sea1:#143553;--sea2:#0a1c30;--sand:#9c8453;--grass:#2f7a52;--grass2:#245f42;--ink:#e6f1fa;--card:#14263bea;--line:#e6f1fa30;--halo:#0a1c30e0;--lab:#f2f8ee;--bub:#1d3550}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sea1),var(--sea2));background-attachment:fixed;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{text-align:center;padding:14px 12px 0}
h1{margin:0;font-size:clamp(22px,5vw,32px);letter-spacing:.1em}
h1 small{display:block;font-size:12px;letter-spacing:.3em;opacity:.6;font-weight:500}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:12px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.wrap{max-width:1180px;margin:0 auto;padding:8px 10px 30px}
.dirbar{display:flex;gap:10px;align-items:flex-end;margin:6px 0}
.dirbar .av{font-size:46px;line-height:1;animation:bob 3s ease-in-out infinite}
.bubble{position:relative;flex:1;background:var(--bub);border:2px solid var(--line);border-radius:16px;padding:9px 14px;font-size:15px;line-height:1.55;min-height:3.3em;box-shadow:0 4px 14px #0002}
.bubble:before{content:"";position:absolute;left:-10px;bottom:14px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.bubble b{color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.bar .sp{flex:1}
.tab,.tg{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px}
.tab.on,.tg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tg.on.gold{background:#f2b61f;border-color:#f2b61f;color:#3a2c00}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.stage{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:linear-gradient(var(--sea1),var(--sea2));transition:filter 1s}
svg.map{display:block;width:100%;height:auto}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;backdrop-filter:blur(6px)}
.panel h2{margin:0 0 6px;font-size:16px}
.side{display:flex;flex-direction:column;gap:12px}
#log{max-height:200px;overflow:auto;font-size:13px;line-height:1.5;padding:0;margin:0;list-style:none}
#log li{border-bottom:1px dashed var(--line);padding:4px 0}
#log i{font-style:normal;color:var(--acc);font-weight:700;margin-right:4px}
.live{font-size:10px;background:var(--acc);color:#fff;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.tags span{font-size:12px;border-radius:8px;padding:1px 8px;color:#fff}
.rel{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 8px}
.chip{border:2px solid var(--line);background:var(--sand);color:#3b2f10;border-radius:11px;padding:3px 9px;font-size:13px}
.chip:hover,.chip.on{border-color:var(--acc);box-shadow:0 2px 0 var(--acc)}
.sub{font-size:12px;opacity:.7;margin:0 0 3px}
#tl{display:none;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-top:10px}
body[data-view="time"] #tl{display:flex}
#tl input{flex:1;accent-color:var(--acc)}
#tl b{min-width:5em;text-align:center}
#listv{display:none}
body[data-view="list"] #listv{display:block}
body[data-view="list"] .stage{display:none}
.lsem{margin-bottom:12px}.lsem h3{margin:0 0 5px;font-size:14px;color:var(--acc)}
.b{cursor:pointer;transition:opacity .4s}.b .up{transition:transform .2s}
.b:hover .up,.b.sel .up{transform:translateY(-4px)}
.b.dim{opacity:var(--dimop)}
.b.sel .top{stroke:var(--acc);stroke-width:4}
.b.ring .top{stroke:#f2b61f;stroke-width:4}
.b.cur .top{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke:#fff;stroke-width:5}}
.b text.nm{font-size:11px;font-weight:700;fill:var(--lab);stroke:var(--halo);stroke-width:3;paint-order:stroke;text-anchor:middle}
body.nonames .nm{display:none}
.e{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:.3;stroke-dasharray:5 6;animation:flow 1.4s linear infinite;transition:opacity .4s}
.e.hot{stroke:var(--acc);opacity:1;stroke-width:3}.e.dim{opacity:.06}.e.off{display:none}
body.noedges .e{display:none}
@keyframes flow{to{stroke-dashoffset:-22}}
.stu{cursor:pointer;animation:bob 2.4s ease-in-out infinite}
.stu text.f{font-size:34px;text-anchor:middle}
.stu text.t{font-size:12px;font-weight:700;text-anchor:middle;fill:var(--lab);stroke:var(--halo);stroke-width:3;paint-order:stroke}
.stu.on text.f{font-size:42px}
@keyframes bob{50%{transform:translateY(-6px)}}
.cur-ocean{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 90;opacity:.45;animation:flow 5s linear infinite}
.drift{animation:drift 40s linear infinite}
.boat{animation:sail 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}
@keyframes sail{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(120px,-20px) rotate(4deg)}}
#tour{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#tour .card{background:var(--bub);border-radius:20px;padding:20px;max-width:380px;text-align:center;border:3px solid var(--acc)}
#tour .card p{line-height:1.7;margin:8px 0 14px}
#tour .card .av{font-size:56px}
#tour .row{display:flex;gap:8px;justify-content:center}
#tour .row button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 16px;font-weight:700}
#tour .row .go{background:var(--acc);color:#fff;border-color:var(--acc)}
footer{text-align:center;font-size:12px;opacity:.65;padding:6px 12px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-view="map">
<header>
<h1>🏝️ 海大電機・學程島<small>NTOU EE · CURRICULUM ISLAND</small></h1>

<div class="wrap">

</div>

<footer>資料整理自「電機系大學部必修與核心課程關聯圖」及「電機系輔系必修科目表」；學期位置與先修連線為依圖面推估，實際以系上公告為準。</footer>

<div id="tour"><div class="card"><div class="av">👨‍🏫</div><p id="tp"></p><div class="row"><button id="tskip">略過</button><button class="go" id="tnext">下一步 →</button></div></div></div>

<script>
const F={b:['數理基礎','#4f9de8'],c:['程式資訊','#8b78ee'],e:['電路電子','#f59a2b'],m:['電磁固態','#f0577d'],s:['訊號通訊控制','#22b793'],w:['電力機械','#d9a514'],l:['實驗課程','#8795a6'],d:['大四領域','#d6457f']};
const RAW=`微積分(一)||1|b|370|520|∫|
普通物理(一)||1|b|440|520|🍎|
普通物理實驗(一)|普物實驗(一)|1|l|510|520|🔬|
計算機概論||1|c|580|520|💻|
程式語言||1|c|650|520|⌨️|m
微積分(二)||2|b|395|590|∬|
普通物理(二)||2|b|450|590|🧲|
普通物理實驗(二)|普物實驗(二)|2|l|505|590|🔬|
電路學(一)||2|e|560|590|💡|m
計算機實習||2|c|615|590|🖥️|
電路學(二)||3|e|190|230|💡|m
電子學(一)||3|e|260|230|🔌|m
工程數學(一)||3|b|330|230|📈|m
線性代數||3|b|190|300|▦|
交換電路與邏輯設計|邏輯設計|3|c|260|300|🔢|
電工實驗(一)||3|l|330|300|🧪|
電子學(二)||4|e|190|370|🔌|m
工程數學(二)||4|b|260|370|📈|m
電磁學||4|m|330|370|🧲|m
複變函數||4|b|190|440|i|
資料結構||4|c|260|440|🌳|
電工實驗(二)||4|l|330|440|🧪|
電子學(三)||5|e|670|230|🔌|m
電磁波||5|m|740|230|📡|m
訊號與系統||5|s|810|230|〰️|
機率學||5|b|670|300|🎲|
電工實驗(三)||5|l|740|300|🧪|
電子電路||6|e|670|370|🔧|k
通訊工程||6|s|740|370|📶|k
電機機械||6|w|810|370|⚙️|k
自動控制||6|s|670|440|🎛️|k
近代物理||6|m|740|440|✨|k
電工實驗(四)||6|l|810|440|🧪|
資訊科技領域|資訊科技|7|c|440|270|🧠|
電波領域|電波|7|m|560|270|📡|
固態電子領域|固態電子|7|m|440|340|💎|
電力與電子電路領域|電力電子|7|w|560|340|🔋|
控制領域|控制|7|s|440|410|🤖|
通訊與訊號處理領域|通訊訊號|7|s|560|410|📻|`;
const C=RAW.split('\n').map((l,i)=>{const a=l.split('|');return{id:i+1,n:a[0],s:a[1]||a[0],sem:+a[2],f:a[3],x:+a[4],y:+a[5],em:a[6],fl:a[7]||''}});
const E=[[1,6],[2,7],[3,8],[8,16],[4,5],[5,10],[5,21],[6,13],[6,14],[6,19],[7,19],[7,32],[9,11],[9,12],[11,28],[11,30],[12,17],[17,23],[13,18],[13,20],[18,25],[20,25],[19,24],[15,21],[23,28],[25,29],[26,29],[25,31],[16,22],[22,27],[27,33],[21,34],[24,35],[32,36],[28,37],[30,37],[31,38],[29,39],[25,39]];
const SEM=['大一上','大一下','大二上','大二下','大三上','大三下','大四上','大四下'];
const STEP=['從微積分、普物打底，順便學會寫程式。','電路學(一)登場，電子學的路從這裡開始。','電路學(二)、電子學(一)、工程數學，專業大爆發。','電磁學、資料結構、複變，工具箱越來越滿。','電磁波、訊號與系統，電子學修到第三段。','核心課程「六選四」，找到你的方向！','六大領域任你選，深入你有興趣的專業。','把所學做成專題，準備畢業，揮別小島！'];
const SKY=['#ffd9a8','#ffe9b8','#bfe9f5','#a9def2','#ffc9a0','#e59aa6','#6b6fb0','#2a3566'];
const NOTE={'電路學(一)':'電路學一下、二上要依序修習，不能跳著修喔！','電路學(二)':'接續一下的電路學，也是輔系必修。','電子學(一)':'電子學二上、二下、三上要依序修，輔系也必修。','電子學(二)':'電子學第二段，後面還有三上。','電子學(三)':'電子學最後一段，通往電子電路核心。','工程數學(一)':'非受予工學士的輔系生，要加修工程數學共 6 學分。','程式語言':'輔系必修的程式設計，3 學分，從這裡打底。','電磁學':'電磁學是電磁波的先修，輔系必修。','電磁波':'電波領域的入口，輔系也必修。','電子電路':'核心課程「六選四」之一。','通訊工程':'核心「六選四」之一，通往通訊與訊號處理。','電機機械':'核心「六選四」之一，銜接電力與電子電路。','自動控制':'核心「六選四」之一，控制領域的起點。','近代物理':'核心「六選四」之一，固態電子會用到。'};
const yr=c=>Math.ceil(Math.min(c.sem,7)/2);
const $=s=>document.querySelector(s);
let sel=null,yf=0,step=1,view='map',timer=null,minor=false,pt=null;

/* ---- build svg ---- */
const P='M500 700C260 540 90 430 90 270 90 160 175 90 280 90 370 90 450 140 500 215 550 140 630 90 720 90 825 90 910 160 910 270 910 430 740 540 500 700Z';
const byId=Object.fromEntries(C.map(c=>[c.id,c]));
function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;return `M${a.x} ${a.y}Q${mx-dy*.18} ${my+dx*.18} ${b.x} ${b.y}`}
const plaza=[[510,555,185,66,'大一・啟航灣',510,488],[260,335,128,158,'大二・電路區',260,172],[740,335,128,158,'大三・核心高地',740,172],[500,340,100,112,'大四・領域岬',500,236]];
const stud=[[335,560,'🧑‍🎓'],[128,335,'👩‍💻'],[872,335,'🧑‍🔬'],[500,376,'🧑‍🏫']];
let h=`<defs><path id="hp" d="${P}"/></defs>`;
h+=`<g class="drift"><text x="0" y="70" font-size="50" opacity=".85">☁️</text></g><g class="drift" style="animation-delay:-18s"><text x="0" y="680" font-size="42" opacity=".7">☁️</text></g>`;
for(const [k,s] of [[1.16,.18],[1.1,.28],[1.05,.4]])h+=`<use href="#hp" transform="translate(500 400) scale(${k}) translate(-500 -400)" fill="#fff" opacity="${s*.5}" stroke="#fff" stroke-opacity="${s}" stroke-width="3"/>`;
h+=`<path class="cur-ocean" d="M30 150q60-28 120 0t120 0"/><path class="cur-ocean" d="M760 640q60-28 120 0t100 0" style="animation-delay:-2s"/><path class="cur-ocean" d="M20 560q60-28 120 0t120 0" style="animation-delay:-3s"/><path class="cur-ocean" d="M800 60q50-24 100 0t90 0" style="animation-delay:-1s"/>`;
h+=`<g class="boat"><text x="70" y="420" font-size="44">⛵</text></g><text x="880" y="590" font-size="36">🐋</text><text x="40" y="320" font-size="30">🐟</text>`;
h+=`<use href="#hp" fill="var(--grass)" stroke="var(--sand)" stroke-width="26" stroke-linejoin="round"/><use href="#hp" fill="var(--grass)"/>`;
for(const p of plaza)h+=`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[3]}" fill="var(--grass2)" opacity=".55" stroke="var(--lab)" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="${p[5]}" y="${p[6]}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--lab)" opacity=".8">${p[4]}</text>`;
h+=`<g font-size="30"><text x="210" y="150">🌴</text><text x="690" y="150">🌴</text><text x="130" y="520">🌳</text><text x="840" y="520">🌳</text><text x="330" y="140">🌲</text><text x="620" y="140">🌲</text><text x="560" y="660">🌴</text><text x="420" y="660">🌴</text><text x="500" y="195">⛲</text></g>`;
h+=`<g stroke="var(--sand)" stroke-width="8" stroke-linecap="round" fill="none" opacity=".8"><path d="M510 480Q430 440 300 400"/><path d="M520 480Q600 440 720 400"/><path d="M500 480V440"/></g>`;
h+=`<g id="eg">`+E.map(([a,b],i)=>`<path class="e" data-a="${a}" data-b="${b}" d="${curve(byId[a],byId[b])}"/>`).join('')+`</g><g id="bg">`;
for(const c of C){const col=F[c.f][1];h+=`<g class="b" data-id="${c.id}" transform="translate(${c.x} ${c.y})"><title>${c.n}</title><rect x="-26" y="-20" width="52" height="52" rx="12" fill="#000" opacity=".25"/><g class="up"><rect x="-26" y="-26" width="52" height="52" rx="12" fill="${col}"/><rect class="top" x="-26" y="-26" width="52" height="52" rx="12" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><text y="${c.em.length<2&&/[a-z∫∬▦]/i.test(c.em)?9:8}" text-anchor="middle" font-size="24" fill="#fff" font-weight="800">${c.em}</text>${c.fl.includes('k')?'<text x="22" y="-18" font-size="14">⭐</text>':''}</g><text class="nm" y="48">${c.s}</text></g>`}
h+=`</g><g id="sg">`+stud.map((s,i)=>`<g class="stu" data-y="${i+1}" style="animation-delay:${-i*.5}s"><text class="f" x="${s[0]}" y="${s[1]}">${s[2]}</text><text class="t" x="${s[0]}" y="${s[1]+17}">大${'一二三四'[i]}</text></g>`).join('')+`</g>`;
$('#svg').innerHTML=h;

/* ---- helpers ---- */
const say=t=>{clearInterval(pt);const el=$('#say');let i=0;el.textContent='';pt=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(pt)},20)};
let n=0;const log=m=>{const li=document.createElement('li');li.innerHTML=`<i>#${String(++n).padStart(2,'0')}</i>${m}`;$('#log').prepend(li);while($('#log').children.length>30)$('#log').lastChild.remove()};
const rel=id=>({pre:E.filter(e=>e[1]===id).map(e=>e[0]),post:E.filter(e=>e[0]===id).map(e=>e[1])});
const sm=()=>Math.min(step,7);
function lit(c){
 if(sel){const r=rel(sel);return c.id===sel||r.pre.includes(c.id)||r.post.includes(c.id)}
 if(yf)return yr(c)===yf;
 if(view==='time')return c.sem<=sm();
 return true}
function refresh(){
 document.querySelectorAll('.b').forEach(g=>{const c=byId[g.dataset.id];g.classList.toggle('dim',!lit(c));g.classList.toggle('sel',c.id===sel);g.classList.toggle('ring',minor&&c.fl.includes('m'));g.classList.toggle('cur',view==='time'&&(c.sem===sm()));});
 document.querySelectorAll('.e').forEach(p=>{const a=+p.dataset.a,b=+p.dataset.b;const hot=sel&&(a===sel||b===sel);p.classList.toggle('hot',!!hot);p.classList.toggle('dim',!!sel&&!hot);p.classList.toggle('off',view==='time'&&!sel&&(byId[a].sem>sm()||byId[b].sem>sm()))});
 const fy=view==='time'?Math.ceil(step/2):yf;
 document.querySelectorAll('.stu').forEach(s=>s.classList.toggle('on',+s.dataset.y===fy));
 $('#stage').style.filter='';
 if(view==='time')$('#stage').style.background=`linear-gradient(${SKY[step-1]}, var(--sea2))`;else $('#stage').style.background='';
 $('#stlab').textContent=SEM[step-1];
 renderInfo();renderList();
}
function chips(ids){return ids.length?ids.map(i=>`<button class="chip" data-go="${i}">${byId[i].n}</button>`).join(''):'<span class="sub">無</span>'}
function renderInfo(){
 const el=$('#info');
 if(!sel){el.innerHTML=`<h2>島嶼導覽</h2><p class="sub">點一棟課程建築、一位學生，或切換「時間」檢視看大學四年。</p>`+Object.values(F).map(f=>`<span class="tags" style="display:inline-flex"><span style="background:${f[1]}">${f[0]}</span></span>`).join(' ')+`<p class="sub" style="margin-top:8px">⭐ 核心課程（六選四）　金框 = 輔系必修路徑</p>`;return}
 const c=byId[sel],r=rel(sel);
 el.innerHTML=`<h2>${c.em} ${c.n}</h2><div class="tags"><span style="background:${F[c.f][1]}">${F[c.f][0]}</span><span style="background:#6a7a8c">${c.sem>=7?'大四':SEM[c.sem-1]}</span>${c.fl.includes('k')?'<span style="background:#e6a000">核心六選四</span>':''}${c.fl.includes('m')?'<span style="background:#c99a00">輔系必修</span>':''}</div><p class="sub">先修／銜接前課</p><div class="rel">${chips(r.pre)}</div><p class="sub">後續可銜接</p><div class="rel">${chips(r.post)}</div>`;
}
function renderList(){
 let x='';for(let s=1;s<=7;s++)x+=`<div class="lsem"><h3>${s===7?'大四・六大領域':SEM[s-1]}</h3><div class="rel">${C.filter(c=>c.sem===s).map(c=>`<button class="chip${c.id===sel?' on':''}" data-go="${c.id}" style="border-left:6px solid ${F[c.f][1]}">${c.n}${c.fl.includes('k')?' ⭐':''}</button>`).join('')}</div></div>`;
 $('#listv').innerHTML=x}
function pick(id){
 sel=sel===id?null:id;yf=0;
 if(sel){const c=byId[sel],r=rel(sel);say(NOTE[c.n]||(r.pre.length?`${c.n}：先備課程有 ${r.pre.map(i=>byId[i].n).join('、')}，記得依序修習。`:`${c.n}：這是起點課程，之後可以接 ${r.post.map(i=>byId[i].n).join('、')||'更多專業課'}。`));log(`<b>${c.n}</b> 被點亮，連動 ${rel(sel).pre.length+rel(sel).post.length} 個協作關係`)}
 refresh()}
function setView(v){view=v;document.body.dataset.view=v;document.querySelectorAll('.bar .tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v!=='time')stop();else{sel=null;yf=0;say(`${SEM[step-1]}：${STEP[step-1]}`)}log(`切換到「${{map:'全景',list:'清單',time:'時間'}[v]}」檢視`);refresh()}
function stop(){clearInterval(timer);timer=null;$('#play').textContent='▶ 播放'}
function setStep(s){step=s;$('#rng').value=s;say(`${SEM[s-1]}：${STEP[s-1]}`);log(`時間來到 <b>${SEM[s-1]}</b>`);refresh()}

/* ---- events ---- */
$('#svg').addEventListener('click',e=>{const b=e.target.closest('.b'),s=e.target.closest('.stu');
 if(b)pick(+b.dataset.id);
 else if(s){const y=+s.dataset.y;sel=null;yf=yf===y?0:y;if(yf){say(['我是大一新生！基礎科目都在啟航灣，一起打好底。','大二進入電路區，電路學、電子學、工程數學一次登場。','大三是核心高地，要在六門核心課程裡選四門。','大四來到領域岬，六大領域任選，專題等著你。'][y-1]);log(`<b>大${'一二三四'[y-1]}</b>學生出發，點亮該年級課程`)}refresh()}
 else if(sel||yf){sel=null;yf=0;refresh()}});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){pick(+g.dataset.go)}});
document.querySelectorAll('.bar .tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const tgl=(id,fn)=>$(id).onclick=()=>{$(id).classList.toggle('on');fn($(id).classList.contains('on'))};
tgl('#tgE',on=>{document.body.classList.toggle('noedges',!on)});
tgl('#tgN',on=>{document.body.classList.toggle('nonames',!on)});
tgl('#tgM',on=>{minor=on;if(on){say('金框是輔系必修路徑：程式、電路學、電子學、電磁學、電磁波；非受予工學士須加修工程數學 6 學分，至少 25 學分。');log('開啟<b>輔系路徑</b>')}refresh()});
$('#tgE').classList.add('on');
$('#rng').oninput=e=>setStep(+e.target.value);
$('#play').onclick=()=>{if(timer){stop();return}$('#play').textContent='⏸ 暫停';if(step>=8)setStep(1);timer=setInterval(()=>{if(step>=8){stop();return}setStep(step+1)},2300)};
$('#stats').innerHTML=`<span>${C.length} 棟課程建築</span><span>4 個年級</span><span>${E.length} 條協作線</span><span>6 大領域</span>`;

/* ---- tour ---- */
const TOUR=['嗨！我是系主任。歡迎來到海大電機學程島，每一棟建築都是一門課。','點一棟建築，會亮起它的先修與後續課程；點島上的學生，會點亮整個年級。','想看四年的歷程，切換到「時間」按播放；想修輔系，就開啟「輔系路徑」。'];
let ti=0;const showT=()=>{$('#tp').textContent=TOUR[ti];$('#tnext').textContent=ti===2?'開始探索':'下一步 →'};
$('#tnext').onclick=()=>{if(++ti>2)closeT();else showT()};
const closeT=()=>{$('#tour').style.display='none';say('點點看島上的建築吧！我會幫你補充說明。')};
$('#tskip').onclick=closeT;$('#tgH').onclick=()=>{ti=0;showT();$('#tour').style.display='flex'};
showT();log('島嶼載入完成');refresh();say('歡迎來到學程島！');
</script>
</body>
</html>
